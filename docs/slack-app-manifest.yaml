display_information:
  name: SDR Agent
  description: AI SDR 에이전트의 메일 승인 요청, 알림, 대화
  background_color: "#0e5a4b"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: SDR Agent
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - app_mentions:read
      - im:history
      - im:write
      - channels:history
      - users:read
settings:
  event_subscriptions:
    request_url: https://<CLOUD_RUN_URL>/webhooks/slack/events
    bot_events:
      - app_mention
      - message.im
      - message.channels
  interactivity:
    is_enabled: true
    request_url: https://<CLOUD_RUN_URL>/webhooks/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
