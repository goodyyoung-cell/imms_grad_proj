display_information:
  name: SDR Agent
  description: AI SDR 에이전트의 메일 승인 요청과 알림
  background_color: "#0e5a4b"
features:
  bot_user:
    display_name: SDR Agent
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
settings:
  interactivity:
    is_enabled: true
    request_url: https://<CLOUD_RUN_URL>/webhooks/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
