[project]
name = "sdr-agent"
version = "0.1.0"
description = "도메인 특화 AI SDR 에이전트 (KAIST 정보경영프로그램 현장연구)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "google-genai>=1.0",
    "supabase>=2.30",  # 새 비밀 키(sb_secret_...) 형식 지원
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",  # 웹 폼·파일 업로드
    "openpyxl>=3.1",            # 엑셀 리드 업로드
    "google-auth>=2.0",         # 구글 시트 읽기 (Cloud Run 서비스 계정)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sdr_agent*"]

[tool.setuptools.package-data]
sdr_agent = ["knowledge/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
